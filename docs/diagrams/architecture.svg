</g>
<line x1="56" y1="544" x2="904" y2="544" stroke="#bfc0c0"/>
<text x="56" y="568" class="legend-label">Solid: primary flow</text>
<text x="280" y="568" class="legend-label">Dashed: optional or async</text>
<text x="568" y="568" class="legend-label">Data shapes: persisted or in-memory state</text>
<text x="56" y="588" class="legend-label">CLIENT: interface / CORE: main application / COMPONENT: supporting module / EXTERNAL: outside integration</text>
